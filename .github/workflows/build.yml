name: Build arm64 deb

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'scripts/**'
      - 'patches/**'
      - 'config.sh'
      - 'Makefile'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debian arm64 package
    # Native arm64 runner; no QEMU. Fallback: run scripts/run-all.sh locally.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap debian-archive-keyring dpkg-dev file binutils

      - name: Build TwinDesk .deb
        env:
          SKIP_SWAP: '1'
          CARGO_BUILD_JOBS: '3'
          NODE_HEAP_MB: '1536'
        run: bash scripts/run-all.sh

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: TwinDesk-arm64-deb
          path: TwinDesk-*-arm64.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "## TwinDesk arm64 build"
            echo
            if ls TwinDesk-*-arm64.deb >/dev/null 2>&1; then
              for f in TwinDesk-*-arm64.deb; do
                echo "- \`$f\` — $(du -h "$f" | cut -f1)"
                echo "- SHA-256: \`$(sha256sum "$f" | cut -d' ' -f1)\`"
              done
            else
              echo "No .deb was produced. See the \`build.log\` artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
